[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-kali-toolhub"
version = "0.6.0"
description = "Native GTK catalog of real Kali security tools with an isolated container backend"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Spectre ToolHub"}]

[project.scripts]
spectre-toolhub = "toolhub.cli:main"

[tool.setuptools]
packages = ["toolhub"]
